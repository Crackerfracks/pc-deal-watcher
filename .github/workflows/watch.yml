name: Watch for PC part deals

on:
  # No GitHub schedule: it skipped most runs and ran the
  # rest hours late. A cron-job.org job starts this workflow every 2 hours
  # (7 past each odd hour, Eastern) through the workflow_dispatch API instead.
  workflow_dispatch:
    inputs:
      send_test:
        description: "Also send a test alert to every phone channel"
        type: boolean
        default: false
      send_channel_names:
        description: "Send each per-part channel name to the main channel, to copy into ntfy"
        type: boolean
        default: false
      backfill:
        description: "Fill the deals board from the last 7 days without sending alerts"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check deal feeds
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEND_TEST: ${{ inputs.send_test }}
          BACKFILL: ${{ inputs.backfill }}
          SEND_CHANNEL_NAMES: ${{ inputs.send_channel_names }}
        run: python watcher.py
      - name: Save the deals board and history
        run: |
          git config user.name "deal-watcher"
          git config user.email "deal-watcher@users.noreply.github.com"
          git add state BOARD.md
          git diff --cached --quiet || (git commit -m "Update deals board" && git push)
